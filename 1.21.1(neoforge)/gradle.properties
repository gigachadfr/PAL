# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# MC 1.21.1 requires Java 21. This machine's default JVM is Java 26, which the toolchain this
# Gradle version ships with does not support — same pin as the Fabric builds, same reason.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

# Minecraft / loader
minecraft_version=1.21.1
# Matches the NeoForge the Create instance on this machine runs, so the build and the game
# agree. Any 21.1.x will load this mod: nothing here touches NeoForge's own API surface.
neoforge_version=21.1.248

# Mod Properties
mod_version=2.2.0
maven_group=com.gigachad.pal
archives_base_name=PAL
mod_loader=NeoForge
