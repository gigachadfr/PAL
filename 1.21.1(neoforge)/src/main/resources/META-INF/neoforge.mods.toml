modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/gigachadfr/PAL/issues"

[[mods]]
modId = "playeractionlogger"
version = "${version}"
displayName = "PAL"
authors = "giga_chad_77"
description = '''
Logs what the local player does to a JSONL file, for LLM commentary. Client-side only: works in
singleplayer and on servers, and only ever logs your own player.
'''

# Client-side only. `side = "CLIENT"` is what stops a server demanding this mod of a joining
# client — the whole point of a logger that reads only what your own client sees.
#
# The table is `[[dependencies.<modid>]]` at the root, NOT `[[mods.dependencies.<modid>]]`. The
# nested spelling parses as valid TOML and is silently ignored, so the mod still loads while
# every constraint here quietly does nothing — including the CLIENT side. It also leaves nothing
# for Modrinth to read, which is how a release landed there with no loader and no game version.
[[dependencies.playeractionlogger]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.playeractionlogger]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "playeractionlogger.mixins.json"
