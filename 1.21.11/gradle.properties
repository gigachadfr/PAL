# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# MC 1.21.11 runs on Java 21.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

# Fabric Properties
# 1.21.11 is the last release Yarn covers, but this build uses Mojang's official mappings
# anyway, so the source stays in step with the 26.1.2 build instead of being a translation.
minecraft_version=1.21.11
loader_version=0.19.3

# Mod Properties
mod_version=2.2.0
maven_group=com.gigachad.pal
archives_base_name=PAL
mod_loader=Fabric

# Dependencies
fabric_version=0.141.6+1.21.11
