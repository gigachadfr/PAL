plugins {
    // MC 26.1 is unobfuscated, so this is the non-remapping Loom plugin: no mappings, no
    // remapJar, and mods are plain `implementation` dependencies.
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'maven-publish'
    id 'java'
}

version = project.mod_version
group = project.maven_group

// Output name: PAL-Fabric_1.21.11-2.2.0.jar — the loader and the Minecraft version are part of
// the file name because several builds of this mod now live side by side, and "PAL-2.2.0.jar"
// in a downloads folder said nothing about which game it was for.
base {
    archivesName = "${project.archives_base_name}-${project.mod_loader}_${project.minecraft_version}"
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    // Minecraft. No `mappings` line: 26.1+ ships with official names and parameter names.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()

    // No toolchain block on purpose: MC 26.1 needs Java 25+, and this machine has 26. Pinning a
    // toolchain to 25 would make Gradle hunt for a JDK that is not installed; compiling with the
    // daemon's JVM and `release = 25` targets the right bytecode either way.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
