# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# MC 26.1.2 requires the Gradle JVM to be Java 25 or newer.
org.gradle.java.home=/usr/lib/jvm/java-26-openjdk

# Fabric Properties
# MC 26.1 is the first unobfuscated release: Yarn and Intermediary stopped at 1.21.11, so this
# branch builds against Mojang's official mappings (see build.gradle).
minecraft_version=26.1.2
loader_version=0.19.3

# Mod Properties
mod_version=2.1.0
maven_group=com.gigachad.pal
archives_base_name=PAL

# Dependencies
fabric_version=0.155.2+26.1.2
