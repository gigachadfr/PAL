# MC 1.21.1 requires Java 21, and Gradle 8.10 only supports up to Java 23 — running the
# daemon on this machine's default Java 26 makes Loom fail in obscure ways. Pin it to the JDK 21.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

